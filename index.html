<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Podium — Track every game.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #F4F3EA;
      padding: 40px 24px;
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 48px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 16px;
      max-width: 560px;
    }

    h1 span {
      color: #5E45FF;
    }

    p {
      font-size: 16px;
      color: rgba(244, 243, 234, 0.55);
      line-height: 1.7;
      max-width: 400px;
      margin: 0 auto 48px;
    }

    .badge {
      display: inline-block;
      background: rgba(94, 69, 255, 0.12);
      border: 1px solid rgba(94, 69, 255, 0.3);
      color: rgba(244, 243, 234, 0.7);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 1000px;
      margin-bottom: 28px;
    }

    .footer {
      position: fixed;
      bottom: 24px;
      font-size: 12px;
      color: rgba(244, 243, 234, 0.25);
    }

    .footer a {
      color: rgba(244, 243, 234, 0.4);
      text-decoration: none;
    }

    .footer a:hover { color: rgba(244, 243, 234, 0.7); }
  </style>
</head>
<body>
  <div class="logo">Podium</div>

  <div class="badge">Coming Soon</div>

  <h1>Track every game.<br><span>Define your legacy.</span></h1>

  <p>Podium is the stat-tracking and group management app for Magic: The Gathering playgroups. Available now on iOS.</p>

  <div class="footer">
    &copy; 2026 Podium &nbsp;·&nbsp; <a href="mailto:support@podiumapp.gg">support@podiumapp.gg</a>
  </div>
</body>
</html>
